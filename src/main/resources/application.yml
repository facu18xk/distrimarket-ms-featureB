server:
  port: ${PORT:8081}
  servlet:
    context-path: /inventario

spring:
  application:
    name: distrimarket-inventario
  devtools:
    restart:
      enabled: false

  # Configuración de la Base de Datos (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos_db}?sslmode=${DB_SSLMODE:${DB_SSL_MODE:require}}&prepareThreshold=${DB_PREPARE_THRESHOLD:0}}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true # Útil tenerlo en true durante el desarrollo para ver las consultas en consola

  # Configuración de Liquibase (Hereda los changelogs de commons)
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Configuración de Spring Cloud OpenFeign
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
  override-with-generic-response: false

info:
  app:
    version: '@project.version@'

